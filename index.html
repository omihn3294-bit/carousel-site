<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مولّد منشورات التقليب</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --ink: #1c1b19;
    --muted: #6b665d;
    --line: #dcd6c8;
    --brand: #0f5c4d;
    --brand-ink: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Tajawal', Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.7;
  }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 28px; margin: 8px 0 4px; font-weight: 800; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
  }
  label { display: block; font-weight: 700; margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }
  input[type=text], textarea {
    width: 100%;
    font: inherit;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
  }
  textarea { min-height: 90px; resize: vertical; }
  input:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 3px solid #f0b429;
    outline-offset: 2px;
  }
  .hint { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
  button {
    font: inherit;
    font-weight: 700;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--brand);
    padding: 11px 18px;
  }
  .primary { background: var(--brand); color: var(--brand-ink); width: 100%; margin-top: 18px; font-size: 18px; }
  .primary:disabled { opacity: .6; cursor: wait; }
  .secondary { background: #fff; color: var(--brand); }
  #msg { margin: 14px 0 0; min-height: 24px; }
  #msg.err { color: #b3261e; }
  #results { margin-top: 28px; display: none; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .bar h2 { margin: 0; font-size: 20px; }
  .slides { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .slide { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  .slide canvas { width: 100%; height: auto; display: block; border-radius: 8px; }
  .slide button { width: 100%; margin-top: 10px; }
</style>
</head>
<body>
<main>
  <h1>مولّد منشورات التقليب</h1>
  <p class="sub">اكتب منتجك، والذكاء الاصطناعي يكتب النص ويختار التصميم، وتحمّل 4 شرائح جاهزة للنشر.</p>

  <section class="panel">
    <label for="product">اسم المنتج</label>
    <input type="text" id="product" maxlength="200" placeholder="مثال: عطر عود فاخر">

    <label for="details">وصف قصير (اختياري)</label>
    <textarea id="details" maxlength="800" placeholder="مثال: يدوم 12 ساعة، رائحة دافئة، مناسب للهدايا والعيد"></textarea>

    <label for="offer">السعر أو العرض (اختياري)</label>
    <input type="text" id="offer" maxlength="150" placeholder="مثال: 9 ريال عماني، توصيل مجاني لكل ولايات السلطنة">

    <label for="tone">الأسلوب (اختياري)</label>
    <input type="text" id="tone" maxlength="100" placeholder="مثال: فخم، أو حماسي، أو بسيط">

    <label for="photo">صورة المنتج (اختياري)</label>
    <input type="file" id="photo" accept="image/*">
    <p class="hint">الصورة تبقى في جهازك ولا تُرفع لأي مكان.</p>

    <button class="primary" id="go">أنشئ المنشور</button>
    <p id="msg" role="status" aria-live="polite"></p>
  </section>

  <section id="results">
    <div class="bar">
      <h2>الشرائح</h2>
      <button class="secondary" id="all">حمّل الكل</button>
    </div>
    <div class="slides" id="slides"></div>
  </section>
</main>

<script>
const FONT = "'Tajawal', Arial, sans-serif";
const SIZE = 1080;
let productImg = null;
let lastData = null;

const $ = (id) => document.getElementById(id);

// ---------- صورة المنتج ----------
$('photo').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) { productImg = null; if (lastData) render(lastData); return; }
  const img = new Image();
  img.onload = () => { productImg = img; if (lastData) render(lastData); };
  img.src = URL.createObjectURL(file);
});

// ---------- طلب النص والتصميم من الذكاء الاصطناعي ----------
$('go').addEventListener('click', async () => {
  const product = $('product').value.trim();
  if (!product) { setMsg('اكتب اسم المنتج أولاً.', true); return; }

  $('go').disabled = true;
  setMsg('جاري كتابة المنشور وتصميمه...');

  try {
    const r = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        product,
        details: $('details').value.trim(),
        offer: $('offer').value.trim(),
        tone: $('tone').value.trim()
      })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'حدث خطأ');
    lastData = data;
    await document.fonts.load("700 60px 'Tajawal'");
    render(data);
    setMsg('تم. حمّل الشرائح من الأسفل.');
  } catch (err) {
    setMsg(err.message || 'تعذّر إنشاء المنشور، جرّب مرة ثانية.', true);
  } finally {
    $('go').disabled = false;
  }
});

function setMsg(text, isErr) {
  const m = $('msg');
  m.textContent = text;
  m.className = isErr ? 'err' : '';
}

// ---------- القوالب: ألوان هادئة ومريحة للعين، والذكاء الاصطناعي يختار منها ----------
const THEMES = {
  ivory:  { bg: '#F4EFE6', bg2: '#EAE3D5', text: '#2A2926', accent: '#7A5C3E' },
  sage:   { bg: '#E3E9E0', bg2: '#D5DFD2', text: '#22302A', accent: '#3E6B52' },
  rose:   { bg: '#F5E8E6', bg2: '#EBD7D4', text: '#3A2A2E', accent: '#9A4A5C' },
  navy:   { bg: '#1C2B40', bg2: '#16233A', text: '#EDF0F4', accent: '#C9A96B' },
  forest: { bg: '#1F3B33', bg2: '#183029', text: '#F1EEE6', accent: '#D8BA7C' },
  slate:  { bg: '#2C3037', bg2: '#23272D', text: '#ECEDEF', accent: '#86BBA6' }
};


// ---------- الذكاء الاصطناعي يقترح الألوان، والكود يهذّبها لتبقى مريحة وواضحة ----------
const HEX = /^#[0-9a-fA-F]{6}$/;
function hexToHsl(h) {
  const n = parseInt(h.slice(1), 16);
  const r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let H = 0, S = 0; const L = (mx + mn) / 2;
  if (d) {
    S = d / (1 - Math.abs(2 * L - 1));
    if (mx === r) H = ((g - b) / d) % 6; else if (mx === g) H = (b - r) / d + 2; else H = (r - g) / d + 4;
    H *= 60; if (H < 0) H += 360;
  }
  return [H, S, L];
}
function hsl(H, S, L) {
  const c = (1 - Math.abs(2 * L - 1)) * S, x = c * (1 - Math.abs(((H / 60) % 2) - 1)), m = L - c / 2;
  let r = 0, g = 0, b = 0;
  if (H < 60) [r, g, b] = [c, x, 0]; else if (H < 120) [r, g, b] = [x, c, 0];
  else if (H < 180) [r, g, b] = [0, c, x]; else if (H < 240) [r, g, b] = [0, x, c];
  else if (H < 300) [r, g, b] = [x, 0, c]; else [r, g, b] = [c, 0, x];
  const f = (v) => Math.round((v + m) * 255).toString(16).padStart(2, '0');
  return '#' + f(r) + f(g) + f(b);
}
const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
function harmonize(p) {
  if (!p || !HEX.test(p.bg) || !HEX.test(p.accent)) return null;
  const [bh, bs0, bl0] = hexToHsl(p.bg);
  const dark = bl0 < 0.5, bs = Math.min(bs0, 0.32);
  const bl = dark ? clamp(bl0, 0.12, 0.25) : clamp(bl0, 0.88, 0.95);
  const [ah, as0, al0] = hexToHsl(p.accent);
  return {
    bg: hsl(bh, bs, bl),
    bg2: hsl(bh, bs, dark ? bl - 0.04 : bl - 0.05),
    text: dark ? hsl(bh, 0.15, 0.94) : hsl(bh, 0.25, 0.14),
    accent: hsl(ah, Math.min(as0, 0.5), dark ? clamp(al0, 0.6, 0.75) : clamp(al0, 0.25, 0.4))
  };
}

// الزخارف
function decorate(ctx, t, deco) {
  ctx.save();
  ctx.fillStyle = t.accent; ctx.strokeStyle = t.accent;
  if (deco === 'band') {
    ctx.fillRect(0, 0, 36, SIZE);
  } else if (deco === 'corner') {
    ctx.globalAlpha = 0.12;
    ctx.beginPath(); ctx.arc(0, 0, 380, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(SIZE, SIZE, 260, 0, Math.PI * 2); ctx.fill();
  } else if (deco === 'lines') {
    ctx.globalAlpha = 0.5; ctx.lineWidth = 2;
    [96, SIZE - 120].forEach((yy) => { ctx.beginPath(); ctx.moveTo(160, yy); ctx.lineTo(SIZE - 160, yy); ctx.stroke(); });
  } else {
    ctx.globalAlpha = 0.45; ctx.lineWidth = 2;
    ctx.strokeRect(48, 48, SIZE - 96, SIZE - 96);
  }
  ctx.restore();
}

// ---------- الرسم ----------
function render(data) {
  const t = harmonize(data.palette) || THEMES[data.theme] || THEMES.ivory;
  const deco = ['frame', 'band', 'corner', 'lines'].includes(data.decor) ? data.decor : 'frame';
  const layout = data.layout === 'editorial' ? 'editorial' : 'classic';
  const imgPos = data.imagePosition === 'top' ? 'top' : 'bottom';
  const box = $('slides');
  box.innerHTML = '';

  data.slides.slice(0, 4).forEach((s, i) => {
    const canvas = document.createElement('canvas');
    canvas.width = SIZE;
    canvas.height = SIZE;
    drawSlide(canvas.getContext('2d'), s, i, t, layout, imgPos, deco);

    const wrapEl = document.createElement('div');
    wrapEl.className = 'slide';
    const btn = document.createElement('button');
    btn.className = 'secondary';
    btn.textContent = 'حمّل الشريحة ' + (i + 1);
    btn.addEventListener('click', () => download(canvas, i));
    wrapEl.append(canvas, btn);
    box.appendChild(wrapEl);
  });
  $('results').style.display = 'block';
}

function drawSlide(ctx, slide, i, t, layout, imgPos, deco) {
  // الخلفية: تدرج خفيف جداً
  const g = ctx.createLinearGradient(0, 0, 0, SIZE);
  g.addColorStop(0, t.bg);
  g.addColorStop(1, t.bg2);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, SIZE, SIZE);

  decorate(ctx, t, deco);

  // الصورة (الشريحة الأولى والأخيرة): كاملة بدون قص وبحواف
  const hasImg = productImg && (i === 0 || i === 3);
  let top = 130, bottom = SIZE - 150;
  if (hasImg) {
    const maxW = 780, maxH = 390, pad = 24, margin = 110;
    const r = Math.min(maxW / productImg.width, maxH / productImg.height);
    const iw = productImg.width * r, ih = productImg.height * r;
    const cw = iw + pad * 2, ch = ih + pad * 2;
    const cx0 = (SIZE - cw) / 2;
    const cy0 = imgPos === 'top' ? margin : SIZE - margin - ch - 30;
    drawImageCard(ctx, productImg, cx0, cy0, cw, ch, pad, t);
    if (imgPos === 'top') { top = cy0 + ch + 30; bottom = SIZE - 150; }
    else { top = 120; bottom = cy0 - 30; }
  }

  // النص
  const aligned = layout === 'editorial' || i === 2;
  const tS = hasImg ? 70 : 90, bS = hasImg ? 42 : 50;
  const X = SIZE - 160;
  const maxW = aligned ? SIZE - 360 : SIZE - 260;
  ctx.direction = 'rtl';
  ctx.textBaseline = 'alphabetic';

  ctx.font = `800 ${tS}px ${FONT}`;
  const tl = wrap(ctx, String(slide.title || ''), maxW);
  ctx.font = `400 ${bS}px ${FONT}`;
  const raw = String(slide.body || '');
  const items = i === 2
    ? raw.split('\n').filter(Boolean).map((l) => wrap(ctx, l.replace(/^[-•✓\s]+/, ''), maxW - 50))
    : [wrap(ctx, raw, maxW)];

  const tLH = tS * 1.3, bLH = bS * 1.55, itemGap = i === 2 ? 24 : 0;
  const bodyH = items.reduce((s, a) => s + a.length * bLH, 0) + itemGap * (items.length - 1);
  const total = tl.length * tLH + 50 + bodyH;
  let y = top + Math.max(0, (bottom - top - total) / 2) + tS;
  const startY = y;

  ctx.textAlign = aligned ? 'right' : 'center';
  const tx = aligned ? X : SIZE / 2;

  ctx.fillStyle = t.text;
  ctx.font = `800 ${tS}px ${FONT}`;
  tl.forEach((l) => { ctx.fillText(l, tx, y); y += tLH; });
  let lastBase = y - tLH;

  if (!aligned) {
    ctx.fillStyle = t.accent;
    ctx.fillRect(SIZE / 2 - 45, lastBase + 28, 90, 6);
  }

  y = lastBase + 50 + bS;
  ctx.font = `400 ${bS}px ${FONT}`;
  items.forEach((lines) => {
    if (i === 2) {
      ctx.fillStyle = t.accent;
      ctx.beginPath();
      ctx.arc(X - 12, y - bS * 0.32, 9, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = t.text;
    ctx.globalAlpha = 0.9;
    lines.forEach((l) => { ctx.fillText(l, i === 2 ? X - 44 : tx, y); y += bLH; });
    ctx.globalAlpha = 1;
    y += itemGap;
  });

  // خط عمودي بلون التمييز في التصميم الجانبي
  if (aligned) {
    ctx.fillStyle = t.accent;
    ctx.fillRect(SIZE - 118, startY - tS * 0.85, 6, y - itemGap - bS * 0.4 - startY + tS * 0.85);
  }

  // مؤشر الشرائح (4 نقاط)
  for (let k = 0; k < 4; k++) {
    ctx.beginPath();
    ctx.arc(SIZE / 2 + (k - 1.5) * 34, SIZE - 86, 8, 0, Math.PI * 2);
    ctx.fillStyle = t.accent;
    ctx.globalAlpha = k === i ? 1 : 0.3;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawImageCard(ctx, img, x, y, w, h, pad, c) {
  // بطاقة بيضاء خلف الصورة
  ctx.save();
  roundRect(ctx, x, y, w, h, 28);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.restore();

  // الصورة كاملة داخل البطاقة (بدون قص)
  ctx.save();
  roundRect(ctx, x + pad / 2, y + pad / 2, w - pad, h - pad, 18);
  ctx.clip();
  ctx.drawImage(img, x + pad, y + pad, w - pad * 2, h - pad * 2);
  ctx.restore();

  // إطار بلون التمييز
  ctx.save();
  ctx.strokeStyle = c.accent;
  ctx.lineWidth = 3;
  roundRect(ctx, x, y, w, h, 28);
  ctx.stroke();
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// تقسيم النص إلى أسطر حسب العرض
function wrap(ctx, text, maxW) {
  const words = text.split(/\s+/).filter(Boolean);
  const lines = [];
  let line = '';
  words.forEach((w) => {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
    else line = test;
  });
  if (line) lines.push(line);
  return lines;
}

// ---------- التحميل ----------
function download(canvas, i) {
  canvas.toBlob((blob) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `slide-${i + 1}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, 'image/png');
}

$('all').addEventListener('click', () => {
  document.querySelectorAll('#slides canvas').forEach((cv, i) => {
    setTimeout(() => download(cv, i), i * 400);
  });
});
</script>
</body>
</html>
